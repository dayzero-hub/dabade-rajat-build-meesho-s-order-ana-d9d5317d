version: 2

models:
  - name: dim_customers
    description: One row per real person (customer_unique_id), with the address from their most recent order.
    columns:
      - name: customer_key
        description: Surrogate key, md5 of customer_unique_id.
        tests:
          - not_null
          - unique
      - name: customer_unique_id
        description: The real-person id from the raw customers table.
        tests:
          - not_null
          - unique
  - name: dim_sellers
    description: One row per seller.
    columns:
      - name: seller_key
        description: Surrogate key, md5 of seller_id.
        tests:
          - not_null
          - unique
      - name: seller_id
        description: Natural key.
        tests:
          - not_null
          - unique
  - name: dim_products
    description: One row per product, with its category and physical dimensions.
    columns:
      - name: product_key
        description: Surrogate key, md5 of product_id.
        tests:
          - not_null
          - unique
      - name: product_id
        description: Natural key.
        tests:
          - not_null
          - unique
  - name: dim_dates
    description: One row per calendar day covering the order date range, with year / quarter / month / week / weekday grouping columns.
    columns:
      - name: date_key
        description: Surrogate key, the date as an integer yyyymmdd.
        tests:
          - not_null
          - unique
      - name: date_day
        description: Natural key.
        tests:
          - not_null
          - unique
